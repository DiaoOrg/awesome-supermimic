name: Community Stars

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: community-stars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test catalog and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Check bilingual generated content
        run: python3 scripts/update_stars.py --check
      - name: Check whitespace
        run: git diff --check

  refresh:
    needs: validate
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fetch GitHub Stars and generate both READMEs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stars.py
      - name: Validate updated snapshot
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/update_stars.py --check
          git diff --check
      - name: Commit only changed data and generated content
        run: |
          git add data/stars.json README.md README_zh-CN.md
          if git diff --cached --quiet; then
            echo "Stars and status unchanged; no commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: refresh community Stars rankings"
          git push
